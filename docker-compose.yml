services:
  api:
    build: .
    ports: ["8100:8100"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/barber.db
    volumes: ["barber-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 5s
      retries: 20

volumes:
  barber-data:
