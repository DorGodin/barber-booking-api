name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: tests (including the two-worker race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  docker:
    name: container starts, seeds, and answers a login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: start
        run: |
          cp .env.example .env
          docker compose up --build -d
          # Fail here, by name, rather than at the next step with a confusing curl error.
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8100/health && exit 0; sleep 1; done
          echo "the API never became healthy"; docker compose logs; exit 1
      - name: log in as the seeded owner
        run: |
          curl -sf -X POST http://127.0.0.1:8100/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"owner","password":"dev-owner-password"}' | grep -q access_token
      - name: stop
        if: always()
        run: docker compose logs && docker compose down

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Stated here, not left to the repository's default: on a pull request the
    # action reads its commits, and a token without pull-requests: read - the
    # one Dependabot's pull requests get - is refused with a 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
