<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קוד לסריקה · {{shop_brand}}</title>
<style>
  :root { --ink:#111; --mut:#5c574d; --line:#dedad2; --bg:#fff; --gold:#8a6a1f; --pole-red:#a8323a; --pole-blue:#2f4a7a; }
  * { box-sizing:border-box; }
  @font-face { font-family:"Rubik"; font-style:normal; font-weight:300 900; font-display:swap; src:url("/fonts/rubik-hebrew.woff2") format("woff2"); unicode-range:U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family:"Rubik"; font-style:normal; font-weight:300 900; font-display:swap; src:url("/fonts/rubik-latin.woff2") format("woff2"); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  body { margin:0; font-family:"Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); text-align:center; }
  /* One A4 page: the brand, the code and the way to it, between the barber's poles. */
  main { position:relative; max-width:560px; margin:0 auto; padding:40px 48px; }
  main::before, main::after { content:""; position:absolute; top:0; bottom:0; width:14px;
    background:repeating-linear-gradient(-45deg, var(--pole-red) 0 8px, #fff 8px 12px, var(--pole-blue) 12px 20px, #fff 20px 24px); }
  main::before { left:0; } main::after { right:0; }
  h1 { margin:0; font-size:44px; letter-spacing:.5px; }
  .tagline { margin:4px 0 0; font-size:15px; font-weight:700; letter-spacing:6px; }
  .address { margin:8px 0 0; color:var(--gold); font-weight:600; }
  .ask { margin:32px 0 14px; font-size:30px; font-weight:700; }
  .code { width:min(340px, 100%); margin:0 auto; padding:14px; border:2px solid var(--ink); border-radius:18px; }
  .code svg { display:block; width:100%; height:auto; }
  .how { margin:18px 0 0; color:var(--mut); line-height:1.7; }
  .url { margin:10px 0 0; font-size:18px; font-weight:600; direction:ltr; unicode-bidi:isolate; }
  @media print { @page { size:A4; margin:14mm; } main { padding-top:24px; } }
</style>
</head>
<body>
<main data-testid="poster">
  <h1>{{shop_brand}}</h1>
  <p class="tagline">{{shop_tagline}}</p>
  <p class="address">{{shop_address}}</p>
  <p class="ask">סרקו וקבעו תור</p>
  <div class="code" data-testid="poster-code" role="img" aria-label="קוד לסריקה שפותח את {{shop_url}}">{{qr_svg}}</div>
  <p class="how">פותחים את המצלמה, מכוונים לקוד ונכנסים.<br>אפשר להוסיף את המספרה למסך הבית ולקבל תזכורות לפני התור.</p>
  <p class="url" data-testid="poster-url">{{shop_url}}</p>
</main>
</body>
</html>
