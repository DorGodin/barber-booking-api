<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>אין חיבור · {{shop_brand}}</title>
<style>
  :root { --ink:#111; --mut:#5c574d; --line:#dedad2; --bg:#fff; --gold:#8a6a1f; --pole-red:#a8323a; --pole-blue:#2f4a7a; }
  * { box-sizing:border-box; }
  /* The shop's own letters, kept by the worker with this page - there is no connection to fetch them. */
  @font-face { font-family:"Rubik"; font-style:normal; font-weight:300 900; font-display:swap; src:url("/fonts/rubik-hebrew.woff2") format("woff2"); unicode-range:U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family:"Rubik"; font-style:normal; font-weight:300 900; font-display:swap; src:url("/fonts/rubik-latin.woff2") format("woff2"); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; text-align:center;
    font-family:"Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); line-height:1.6;
    padding:calc(30px + env(safe-area-inset-top, 0px)) 28px calc(30px + env(safe-area-inset-bottom, 0px)); }
  /* The barber's poles down both sides, as on the booking page. */
  body::before, body::after { content:""; position:fixed; top:0; bottom:0; width:12px;
    background:repeating-linear-gradient(-45deg, var(--pole-red) 0 7px, #fff 7px 10px, var(--pole-blue) 10px 17px, #fff 17px 20px); }
  body::before { left:0; } body::after { right:0; }
  main { width:100%; max-width:420px; margin:0 auto; padding:28px 22px 22px; border:1px solid var(--line); border-radius:18px; }
  .brand { margin:0 0 18px; font-weight:700; letter-spacing:.5px; color:var(--gold); }
  svg { width:64px; height:64px; fill:none; stroke:var(--mut); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  h1 { margin:14px 0 6px; font-size:22px; }
  p { margin:0 0 24px; color:var(--mut); }
  button { width:100%; min-height:48px; border:0; border-radius:999px; background:var(--ink); color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
</style>
</head>
<body>
<main data-testid="offline">
  <p class="brand">{{shop_brand}}</p>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.8 5.2A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 5.1-2.6M16.8 10.9a10 10 0 0 1 2.2 1.6M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M3 3l18 18"/></svg>
  <h1>אין חיבור כרגע</h1>
  <p>בדקו את ה־Wi‑Fi או את הגלישה בסלולר. כשהחיבור יחזור, המספרה תיפתח מעצמה.</p>
  <button type="button" data-testid="offline-retry">נסו שוב</button>
</main>
<script>
// The connection is back, or asked to try again: the shop opens.
const shop = () => location.replace("/");
window.addEventListener("online", shop);
document.querySelector('[data-testid="offline-retry"]').addEventListener("click", shop);
</script>
</body>
</html>
